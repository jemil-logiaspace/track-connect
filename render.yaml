services:
  - type: web
    name: track-connect-api
    runtime: node
    repo: https://github.com/jemil-logiaspace/track-connect
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://trackflowz.netlify.app
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: b36f9a001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@trace-logistics.com
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_TELEGRAM
        sync: false
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: AVERAGE_SPEED_KMH
        value: "60"

